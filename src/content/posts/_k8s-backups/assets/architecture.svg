<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="architecture-t" font-family="Google Sans Code, ui-monospace, monospace"><style>@font-face{font-family:"Google Sans Code";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Google Sans Code";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}</style><title id="architecture-t">Backup architecture. Two NVMe drives sit under an mdadm array and the LVM volume group vg1, which holds a thin pool for snapshot-backed PVs and thick LVs for the databases. OpenEBS serves them through the mayastor, lvm-thin and lvm-thick StorageClasses, with Mayastor backed by the thin pool. Velero uploads cluster resources through an S3 encryption proxy and PV snapshots through its Kopia data mover. Postgres (CloudNativePG with pgBackRest), SeaweedFS (filer.backup) and ClickHouse (clickhouse-backup with an S3 encryption proxy sidecar) are backed up by tooling in their umbrella charts. Everything is encrypted before it reaches the S3 provider.</title><defs><marker id="p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" fill="#54515b"/></marker><marker id="e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" fill="#eb6834"/></marker></defs>
